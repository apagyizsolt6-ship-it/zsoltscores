name: Android APK Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android

      - name: Engedélyek hozzáadása (Internet + Értesítések)
        run: |
          # INTERNET
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          # POST_NOTIFICATIONS (Android 13+)
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Gradle tárolók javítása
        run: |
          mkdir -p \~/.gradle/init.d
          cat << 'EOF' > \~/.gradle/init.d/repos.gradle
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
              settings.dependencyResolutionManagement {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          EOF

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zsoltscores-release
          path: build/app/outputs/flutter-apk/app-release.apk
